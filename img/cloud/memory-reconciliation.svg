<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Ingest flows into Reconcile, which resolves to an Add, Update, Delete, or No-op decision, updating the stored Memories and recording a Trace." font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#178fff" />
    </marker>
  </defs>

  <!-- ingest -->
  <rect x="12" y="66" width="150" height="56" fill="none" stroke="#64748b" stroke-width="1.5" />
  <text x="87" y="90" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="ui-monospace, monospace">ingest()</text>
  <text x="87" y="108" text-anchor="middle" fill="#64748b" font-size="11">new information</text>

  <line x1="164" y1="94" x2="256" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- reconcile (accent) -->
  <rect x="258" y="52" width="200" height="84" fill="none" stroke="#178fff" stroke-width="1.75" />
  <text x="358" y="80" text-anchor="middle" fill="#178fff" font-size="15" font-weight="600">Reconcile</text>
  <text x="358" y="104" text-anchor="middle" fill="#94a3b8" font-size="11.5">Add · Update · Delete · No-op</text>
  <text x="358" y="121" text-anchor="middle" fill="#64748b" font-size="10.5">decision vs. existing memory</text>

  <line x1="460" y1="94" x2="552" y2="94" stroke="#178fff" stroke-width="1.5" marker-end="url(#arrow-accent)" />

  <!-- memories -->
  <rect x="554" y="66" width="150" height="56" fill="none" stroke="#64748b" stroke-width="1.5" />
  <text x="629" y="90" text-anchor="middle" fill="#94a3b8" font-size="14">Memories</text>
  <text x="629" y="108" text-anchor="middle" fill="#64748b" font-size="11">reconciled state</text>

  <!-- trace branch -->
  <line x1="358" y1="136" x2="358" y2="172" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="358" y="188" text-anchor="middle" fill="#64748b" font-size="11">every decision recorded as a Trace</text>
</svg>
